services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      ALLOWED_ORIGINS: http://localhost:8501
      # ALAN API secrets belong only to the offline batch job or a separate report endpoint.
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "8501:8501"
    depends_on:
      - backend
