<script>
(() => {
  const state = {
    page: new URLSearchParams(location.search).get('page') || 'dashboard',
    distance: 500,
    groups: new Set(['65세 이상','독거노인']),
    layers: {shelters:true,boundary:true,gaps:true},
    budget: 300000000,
    facilityCount: 3,
    types: new Set(['경로당','복지관','주민센터']),
    selected: [],
    analysisRun: 0
  };

  const candidates = [
    {id:1,name:'북구 산격3동 경로당',short:'산격3동',type:'경로당',cost:80000000,people:1120,score:92,x:348,y:78},
    {id:2,name:'서구 비산7동 주민센터',short:'비산7동',type:'주민센터',cost:90000000,people:980,score:87,x:158,y:164},
    {id:3,name:'달서구 신당동 복지관',short:'신당동',type:'복지관',cost:109000000,people:990,score:85,x:245,y:276},
    {id:4,name:'중구 대신동 공공시설',short:'대신동',type:'주민센터',cost:70000000,people:760,score:74,x:332,y:205},
    {id:5,name:'달성군 화원읍 주민센터',short:'화원읍',type:'주민센터',cost:65000000,people:610,score:70,x:118,y:258},
    {id:6,name:'동구 신암5동 경로당',short:'신암5동',type:'경로당',cost:75000000,people:690,score:72,x:445,y:139}
  ];

  const existingShelters = [
    [116,112],[151,113],[192,92],[231,111],[280,86],[324,109],[382,102],[430,116],[477,145],[510,183],
    [115,183],[164,210],[214,183],[263,202],[313,173],[365,197],[418,185],[468,222],[127,252],[185,272],
    [292,275],[353,258],[410,280],[484,262],[535,220]
  ];
  const districts = [
    ['달성군',105,238],['서구',183,156],['북구',307,99],['동구',448,134],['중구',296,191],['남구',312,240],['달서구',210,251],['수성구',436,226]
  ];

  const formatMoney = n => n.toLocaleString('ko-KR') + '원';
  const formatM = n => (n/1000000).toLocaleString('ko-KR') + '백만원';
  const icon = (name, cls='') => `<svg class="icon ${cls}"><use href="#i-${name}"/></svg>`;
  const pct = (a,b) => b ? Math.round(a/b*100) : 0;

  function showToast(message){
    const t=document.getElementById('toast');t.textContent=message;t.classList.add('show');clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>t.classList.remove('show'),1900);
  }

  function getAccessMetrics(){
    const table={300:{outside:7890,areas:58,avg:980,gradeA:18},500:{outside:6150,areas:43,avg:812,gradeA:12},800:{outside:3890,areas:26,avg:630,gradeA:8}};
    const base={...table[state.distance]};
    if(!state.groups.has('독거노인')) base.outside=Math.round(base.outside*.82);
    if(!state.groups.has('65세 이상')) base.outside=Math.round(base.outside*.44);
    return base;
  }

  function optimize(){
    const eligible=candidates.filter(c=>state.types.has(c.type));
    let best=[];let bestPeople=-1;let bestScore=-1;
    const n=eligible.length;
    for(let mask=1;mask<(1<<n);mask++){
      const set=[];let cost=0,people=0,score=0;
      for(let i=0;i<n;i++) if(mask&(1<<i)){set.push(eligible[i]);cost+=eligible[i].cost;people+=eligible[i].people;score+=eligible[i].score;}
      if(set.length<=state.facilityCount && cost<=state.budget && (people>bestPeople || (people===bestPeople && score>bestScore))){best=set;bestPeople=people;bestScore=score;}
    }
    state.selected=best.sort((a,b)=>b.score-a.score);
    return best;
  }
  optimize();

  function pageHeader(title,subtitle){return `<div class="page-header"><div><h1 class="page-title">${title}</h1><p class="page-subtitle">${subtitle}</p></div><div class="demo-chip">${icon('spark','tiny')} Demo mode · 시연용 데이터</div></div>`}
  function kpiCard(iconName,label,value,note){return `<div class="card kpi-card"><div class="kpi-icon">${icon(iconName)}</div><div><div class="kpi-label">${label}</div><div class="kpi-value">${value}</div><div class="kpi-note">${note}</div></div></div>`}

  function hexPoints(cx,cy,r){const pts=[];for(let i=0;i<6;i++){const a=Math.PI/180*(60*i-30);pts.push(`${(cx+r*Math.cos(a)).toFixed(1)},${(cy+r*Math.sin(a)).toFixed(1)}`)}return pts.join(' ')}
  function riskAt(x,y,mode){
    const hot=[[165,170,1],[335,132,.93],[248,274,.96],[451,232,.82]];
    let v=.08;
    hot.forEach(([hx,hy,w])=>{const d=Math.hypot(x-hx,y-hy);v+=Math.max(0,1-d/115)*w*.95});
    v=Math.min(1,v);
    if(mode==='after'){
      state.selected.forEach(c=>{const d=Math.hypot(x-c.x,y-c.y);v-=Math.max(0,1-d/85)*.55});
      v=Math.max(.03,v);
    }
    if(mode==='recommend') v*=.28;
    return v;
  }
  function riskColor(v,mode){
    if(mode==='recommend') return v>.22?'#203542':'#13232f';
    if(v>.82)return '#df392f'; if(v>.62)return '#e8702c'; if(v>.44)return '#d9a24d'; if(v>.25)return '#41647b'; return '#244258';
  }
  function pinSvg(x,y,color='#ff6a33',size=8,ring=false,label=''){
    return `<g transform="translate(${x} ${y})"><circle r="${ring?11:size}" fill="${ring?'rgba(255,90,43,.12)':'rgba(3,10,15,.8)'}" stroke="${color}" stroke-width="${ring?2:1.4}"/><circle r="${ring?4:2.8}" fill="${color}" stroke="#fff" stroke-width="1"/>${label?`<text y="4" text-anchor="middle" font-size="11" font-weight="850" fill="#fff">${label}</text>`:''}</g>`;
  }
  function daeguMap(mode='risk',opts={}){
    const uid='m'+Math.random().toString(36).slice(2,8);
    const outline='M74 97 C95 58 145 42 196 57 C229 28 284 38 323 57 C374 35 422 55 454 88 C509 86 553 122 557 166 C592 198 568 247 528 263 C504 306 449 326 397 302 C348 333 294 326 253 301 C205 330 148 310 119 279 C72 270 47 231 59 195 C31 157 43 118 74 97 Z';
    let cells='';
    for(let r=0;r<13;r++){
      for(let c=0;c<21;c++){
        const x=60+c*25+(r%2?12.5:0), y=52+r*22;
        const v=riskAt(x,y,mode);
        cells+=`<polygon points="${hexPoints(x,y,15)}" fill="${riskColor(v,mode)}" stroke="rgba(203,220,232,.13)" stroke-width=".6"><title>상대 폭염 취약도 ${(v*100).toFixed(0)}</title></polygon>`;
      }
    }
    let roads='';
    for(let i=0;i<14;i++){const y=60+i*20;roads+=`<path class="map-road" d="M55 ${y} C150 ${y-25} 240 ${y+20} 330 ${y-5} S500 ${y+15} 565 ${y-10}"/>`;}
    for(let i=0;i<9;i++){const x=75+i*58;roads+=`<path class="map-road" d="M${x} 48 C${x-20} 120 ${x+22} 195 ${x-10} 315"/>`;}
    let coverage='';let pins='';
    const radius=state.distance===300?22:state.distance===800?47:34;
    const drawExisting=(count,all=false)=>{
      existingShelters.slice(0,all?existingShelters.length:count).forEach(([x,y],idx)=>{
        coverage+=`<circle cx="${x}" cy="${y}" r="${radius}" fill="rgba(67,132,190,.17)" stroke="rgba(83,153,211,.43)" stroke-width="1"/>`;
        pins+=pinSvg(x,y,'#4e9ddd',4,false);
      });
    };
    if(mode==='access') drawExisting(0,true);
    if(mode==='before') drawExisting(8,false);
    if(mode==='after') drawExisting(0,true);
    if(mode==='dashboard'){
      [[165,170],[335,132],[248,274],[451,232]].forEach(([x,y])=>{pins+=`<circle cx="${x}" cy="${y}" r="13" fill="none" stroke="#ff5a2b" stroke-width="2" opacity=".32" class="pulse"/>`+pinSvg(x,y,'#ee4737',5,false);});
    }
    if(mode==='risk'){
      [[165,170],[335,132],[248,274],[451,232]].forEach(([x,y])=>pins+=pinSvg(x,y,'#ef493b',5,true));
    }
    if(mode==='recommend'){
      existingShelters.forEach(([x,y])=>pins+=`<g transform="translate(${x} ${y})"><path d="M0-7c4 0 7 3 7 7 0 4-7 10-7 10S-7 4-7 0c0-4 3-7 7-7Z" fill="#e96a2d" stroke="#ffb071" stroke-width=".7"/><circle r="1.8" fill="#fff"/></g>`);
      state.selected.forEach((c,i)=>{coverage+=`<circle cx="${c.x}" cy="${c.y}" r="55" fill="rgba(255,137,36,.16)" stroke="rgba(255,160,65,.54)" stroke-dasharray="5 4"/><circle cx="${c.x}" cy="${c.y}" r="34" fill="rgba(255,91,43,.11)"/>`;pins+=`<g transform="translate(${c.x} ${c.y})"><circle r="15" fill="#cb3747" stroke="#ff9ba5" stroke-width="2"/><text y="4.5" text-anchor="middle" fill="#fff" font-size="13" font-weight="850">${i+1}</text></g>`});
      candidates.filter(c=>!state.selected.some(s=>s.id===c.id)).slice(0,2).forEach(c=>pins+=`<g transform="translate(${c.x} ${c.y})"><circle r="13" fill="#455766" stroke="#8fa1ae"/><text y="4" text-anchor="middle" fill="#fff" font-size="11" font-weight="800">${c.id}</text></g>`)
    }
    if(mode==='after'){
      state.selected.forEach(c=>{coverage+=`<circle cx="${c.x}" cy="${c.y}" r="${radius+7}" fill="rgba(255,105,43,.12)" stroke="rgba(255,118,55,.72)" stroke-width="1.5"/>`;pins+=pinSvg(c.x,c.y,'#ff702f',5,true);});
    }
    if(mode==='access' && !state.layers.shelters){coverage='';pins='';}
    let gapOverlay='';
    if((mode==='access'||mode==='before') && state.layers.gaps!==false){
      [[164,172,44],[334,135,42],[246,273,46],[451,231,38]].forEach(([x,y,r])=>gapOverlay+=`<circle cx="${x}" cy="${y}" r="${r}" fill="rgba(221,57,47,.24)" stroke="rgba(239,99,45,.48)" stroke-width="1"/>`);
    }
    const boundary=state.layers.boundary===false?'':`<path class="map-boundary" d="M175 63 205 128 185 192 222 302M315 53 304 132 321 192 298 313M443 75 405 142 425 213 398 302M80 195 203 186 324 196 546 176M114 254 247 233 397 248 521 258"/>`;
    const labels=districts.map(d=>`<text class="map-label" x="${d[1]}" y="${d[2]}">${d[0]}</text>`).join('');
    const legend = opts.legend===false?'':`<div class="map-legend"><div class="legend-title">${mode==='recommend'?'범례':'취약도 수준'}</div>${mode==='recommend'?`<div class="legend-row"><span class="legend-swatch" style="border-radius:50%;background:#cb3747"></span>선정 후보지</div><div class="legend-row"><span class="legend-swatch" style="border-radius:50%;background:#e96a2d"></span>기존 시설</div><div class="legend-row"><span class="legend-swatch" style="background:rgba(255,137,36,.3)"></span>500m 영향권</div>`:`<div class="legend-gradient"></div><div style="display:flex;justify-content:space-between;font-size:9px;color:#8396a5"><span>낮음</span><span>높음</span></div>`}</div>`;
    return `<div class="map-stage"><svg class="map-svg" viewBox="0 0 620 360" preserveAspectRatio="xMidYMid meet"><defs><clipPath id="${uid}"><path d="${outline}"/></clipPath><filter id="glow${uid}"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="620" height="360" fill="#08121a"/>${roads}<g clip-path="url(#${uid})">${cells}${gapOverlay}${coverage}</g><path d="${outline}" fill="none" stroke="#9cafbd" stroke-width="1.6"/>${boundary}${pins}${labels}<path d="M505 322h70" stroke="#d5dfe5" stroke-width="2"/><text x="575" y="316" text-anchor="end" fill="#c5d0d8" font-size="9">5 km</text></svg>${legend}<div class="map-controls"><button data-map-action="zoom-in">${icon('plus','small')}</button><button data-map-action="zoom-out">${icon('minus','small')}</button><button data-map-action="center">${icon('target','small')}</button><button data-map-action="fullscreen">${icon('expand','small')}</button></div><div class="map-caption">데이터 기준일 · 2025. 08. 01.</div></div>`;

    const sel=state.selected;const protectedPeople=sel.reduce((s,c)=>s+c.people,0)||3090;const before=8420,after=before+protectedPeople;const outsideBefore=6150,outsideAfter=Math.max(0,outsideBefore-Math.round(protectedPeople*.98));
    return `<div class="page">${pageHeader('정책 효과 비교 · Before / After','추천 후보지 적용 전후의 보호 범위와 접근성 변화를 비교합니다')}
      <div class="compare-kpis">
        <div class="card compare-kpi"><div class="kpi-icon">${icon('users')}</div><div><span class="kpi-label">접근 가능 취약인구</span><b>${before.toLocaleString()}명 → ${after.toLocaleString()}명</b><em>+${protectedPeople.toLocaleString()}명 (+${Math.round(protectedPeople/before*100)}%)</em></div></div>
        <div class="card compare-kpi"><div class="kpi-icon">${icon('alert')}</div><div><span class="kpi-label">도보권 밖 취약인구</span><b>${outsideBefore.toLocaleString()}명 → ${outsideAfter.toLocaleString()}명</b><em>-${(outsideBefore-outsideAfter).toLocaleString()}명 (-${Math.round((outsideBefore-outsideAfter)/outsideBefore*100)}%)</em></div></div>
        <div class="card compare-kpi"><div class="kpi-icon">${icon('walk')}</div><div><span class="kpi-label">평균 쉼터 접근거리</span><b>812m → 540m</b><em>-272m (-33.5%)</em></div></div>
        <div class="card compare-kpi"><div class="kpi-icon">${icon('shield')}</div><div><span class="kpi-label">예산 대비 보호효율</span><b>${(protectedPeople/(state.budget/1000000)).toFixed(1)}명/백만원</b><em>동일 예산 시나리오</em></div></div>
      </div>
      <div class="compare-layout">
        <section class="card comparison-map"><div class="card-header"><div><div class="card-title" style="font-size:18px">Before</div><div class="kpi-note">추천 후보지 적용 전</div></div></div><div class="map-body">${daeguMap('before')}</div></section>
        <section class="card comparison-map"><div class="card-header"><div><div class="card-title" style="font-size:18px">After</div><div class="kpi-note">추천 후보지 적용 후</div></div></div><div class="map-body">${daeguMap('after')}</div></section>
        <div class="compare-side">
          <section class="card"><div class="card-header"><div class="card-title">개선 효과 요약</div></div><div class="summary-list"><div class="summary-line">${icon('users')}<div>접근 가능한 취약인구가 <b>${protectedPeople.toLocaleString()}명</b> 증가하여 더 많은 시민이 보호받습니다.</div></div><div class="summary-line">${icon('alert')}<div>도보권 밖 취약인구가 <b>${(outsideBefore-outsideAfter).toLocaleString()}명</b> 감소하여 사각지대가 줄어듭니다.</div></div><div class="summary-line">${icon('walk')}<div>평균 쉼터 접근거리가 <b>272m</b> 단축되어 더 빠른 접근이 가능합니다.</div></div></div></section>
          <section class="card"><div class="card-header"><div class="card-title">지표 변화</div><div style="font-size:9px;color:#899ba8">■ Before　<span style="color:var(--orange)">■ After</span></div></div><div class="bar-chart">${[[68,92,'접근 가능<br>취약인구','8,420','11,510'],[78,40,'도보권 밖<br>취약인구','6,150','3,120'],[55,36,'평균 접근<br>거리','812','540'],[52,72,'보호 효율','8.2','10.3']].map(b=>`<div class="bar-group"><div class="bar" style="height:${b[0]}%"><span>${b[3]}</span></div><div class="bar after" style="height:${b[1]}%"><span>${b[4]}</span></div><div class="bar-label">${b[2]}</div></div>`).join('')}</div></section>
          <section class="card"><div class="card-header"><div class="card-title" style="color:#ffb04d">${icon('spark','small')} LLM 정책 브리핑</div></div><div class="briefing-mini"><div style="font-size:11px;color:#b9c5ce;line-height:1.65">추천 후보지 적용 시 서구·북구·달서구의 보호 범위가 크게 확대됩니다. 해당 축을 1차 투자 권역으로 검토하는 것이 효율적입니다.</div><button class="secondary-button" data-open-briefing style="width:100%;margin-top:12px">상세 브리핑 보기</button></div></section>
        </div>
      </div>
    </div>`;
  }

  function briefingText(){
    const selected=state.selected;const used=selected.reduce((s,c)=>s+c.cost,0);const people=selected.reduce((s,c)=>s+c.people,0);
    const names=selected.map((c,i)=>`${i+1}. ${c.name}`).join('\n') || '조건에 맞는 후보지가 없습니다.';
    return `temperAIture 대구 폭염 대응 정책 브리핑\n\n[핵심 판단]\n폭염 위험과 취약인구가 중첩되지만 기존 무더위쉼터 도보권에서 벗어난 지역을 우선 검토해야 합니다.\n\n[추천 투자안]\n${names}\n\n[예상 효과]\n- 추가 보호 가능 취약인구: ${people.toLocaleString()}명\n- 사용 예산: ${formatMoney(used)} / ${formatMoney(state.budget)}\n- 예산 사용률: ${pct(used,state.budget)}%\n- 평균 접근거리: 812m → 540m\n\n[해석]\n북구·서구·달서구 축에 시설을 분산 배치하면 특정 권역에 집중된 사각지대를 동시에 보완할 수 있습니다. 입지 추천은 미리 정의된 공공시설 후보군 안에서 예산 제약과 보호 인구를 비교한 시연 결과입니다.\n\n※ 본 브리핑의 수치는 해커톤 시연용 가공 데이터입니다.`;
  }
  function briefingHtml(){
    const selected=state.selected;const used=selected.reduce((s,c)=>s+c.cost,0);const people=selected.reduce((s,c)=>s+c.people,0);
    return `<div class="briefing-section" style="padding-top:0"><h3>${icon('spark','small')} 핵심 판단</h3><p>폭염 위험과 고령·독거 취약인구가 중첩되지만 기존 무더위쉼터의 도보 접근권에서 벗어난 지역을 우선 투자 대상으로 검토합니다.</p></div><div class="briefing-section"><h3>${icon('trophy','small')} 추천 투자안</h3>${selected.map((c,i)=>`<div class="priority-card"><div class="num">${i+1}</div><div><strong>${c.name}</strong><span>예상 보호 ${c.people.toLocaleString()}명 · 설치비 ${formatM(c.cost)} · 점수 ${c.score}</span></div></div>`).join('')||'<p>현재 조건에 맞는 후보지가 없습니다.</p>'}</div><div class="briefing-section"><h3>${icon('chart','small')} 예상 정책 효과</h3><ul><li>추가 보호 가능 취약인구 <b>${people.toLocaleString()}명</b></li><li>예산 사용률 <b>${pct(used,state.budget)}%</b> (${formatMoney(used)})</li><li>평균 쉼터 접근거리 <b>812m → 540m</b></li><li>도보권 밖 취약인구 약 <b>49.3% 감소</b></li></ul></div><div class="briefing-section"><h3>${icon('alert','small')} 해석 시 주의사항</h3><p>추천 결과는 사전에 정의된 공공시설 후보군과 시연용 비용·인구 데이터에 기반합니다. 실제 정책 적용 전에는 현장 운영 가능성, 소유권, 냉방 설비, 경사도와 보행 안전성을 추가 검증해야 합니다.</p></div>`;
  }

  function renderBriefing(){
    return `<div class="page">${pageHeader('LLM 정책 브리핑','공간분석과 예산 최적화 결과를 담당자가 바로 활용할 수 있는 정책 언어로 정리합니다')}
      <div class="briefing-page-grid">
        <section class="card briefing-document"><div class="briefing-cover"><div><h2>대구 폭염 대응 투자 우선순위</h2><p>분석 기준일 2025. 08. 01. · 시나리오 예산 ${formatMoney(state.budget)}</p></div><div class="kpi-icon">${icon('file')}</div></div>${briefingHtml()}</section>
        <div style="display:grid;gap:13px;align-content:start"><section class="card"><div class="card-header"><div class="card-title">브리핑 활용</div></div><div class="briefing-actions"><button class="primary-button" id="copyBriefingPage">${icon('copy','small')} 내용 복사</button><button class="secondary-button" id="downloadBriefingPage">${icon('download','small')} 텍스트 다운로드</button><button class="secondary-button" data-go="compare">${icon('chart','small')} Before / After 확인</button></div></section><section class="card assumption-card"><b>분석 전제</b>공통 행정동 단위 통합 · 도보권 ${state.distance}m · 후보지 유형 ${[...state.types].join(' · ')} · 설치 가능 ${state.facilityCount}개<br><br><span style="color:#6f8392">※ 본 화면의 수치와 문장은 시연을 위한 가공 데이터입니다.</span></section></div>
      </div>
    </div>`;
  }

  const renderers={dashboard:renderDashboard,risk:renderRisk,access:renderAccess,recommend:renderRecommend,compare:renderCompare,briefing:renderBriefing};
  function render(){
    if(!renderers[state.page]) state.page='dashboard';
    document.getElementById('content').innerHTML=renderers[state.page]();
    document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active',n.dataset.page===state.page));
    try { if (location.protocol === 'http:' || location.protocol === 'https:') history.replaceState(null,'',location.pathname+'?page='+state.page); } catch (_) {}
    bindPageEvents();
  }
  function go(page){state.page=page;render();document.getElementById('content').scrollTop=0;}

  function bindPageEvents(){
    document.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.go)));
    document.querySelectorAll('[data-open-briefing]').forEach(b=>b.addEventListener('click',openBriefing));
    document.querySelectorAll('[data-map-action]').forEach(b=>b.addEventListener('click',()=>showToast(b.dataset.mapAction==='fullscreen'?'지도 전체화면은 시연 모드입니다.':'지도 조작을 반영했습니다.')));
    const distance=document.getElementById('distanceSelect');if(distance) distance.addEventListener('change',e=>{state.distance=+e.target.value;render();});
    document.querySelectorAll('[data-group]').forEach(b=>b.addEventListener('click',()=>{const g=b.dataset.group;state.groups.has(g)?state.groups.delete(g):state.groups.add(g);render();}));
    document.querySelectorAll('[data-layer]').forEach(b=>b.addEventListener('click',()=>{const l=b.dataset.layer;state.layers[l]=!state.layers[l];render();}));
    const rerun=document.getElementById('rerunAccess');if(rerun) rerun.addEventListener('click',()=>{state.analysisRun++;rerun.classList.add('loading');rerun.innerHTML='분석 중';setTimeout(()=>{render();showToast('접근성 분석이 갱신되었습니다.');},700)});
    const budget=document.getElementById('budgetInput');if(budget){budget.addEventListener('focus',()=>budget.select());budget.addEventListener('change',()=>{const v=+budget.value.replace(/[^0-9]/g,'');state.budget=Math.max(30000000,v||300000000);optimize();setTimeout(render,0);});}
    const cnt=document.getElementById('facilityCount');if(cnt) cnt.addEventListener('change',e=>{state.facilityCount=+e.target.value;optimize();render();});
    const rd=document.getElementById('recommendDistance');if(rd) rd.addEventListener('change',e=>{state.distance=+e.target.value;render();});
    document.querySelectorAll('[data-type]').forEach(b=>b.addEventListener('click',()=>{const t=b.dataset.type;state.types.has(t)?state.types.delete(t):state.types.add(t);if(state.types.size===0)state.types.add(t);optimize();render();}));
    const run=document.getElementById('runRecommend');if(run) run.addEventListener('click',()=>{run.classList.add('loading');run.innerHTML='분석 중';setTimeout(()=>{optimize();render();showToast(`최적 조합 ${state.selected.length}개를 추천했습니다.`);},850)});
    const c1=document.getElementById('copyBriefingPage');if(c1)c1.addEventListener('click',copyBriefing);
    const d1=document.getElementById('downloadBriefingPage');if(d1)d1.addEventListener('click',downloadBriefing);
  }

  function openBriefing(){document.getElementById('modalBriefingBody').innerHTML=briefingHtml();document.getElementById('briefingModal').classList.add('open');}
  function closeBriefing(){document.getElementById('briefingModal').classList.remove('open');}
  async function copyBriefing(){
    try{await navigator.clipboard.writeText(briefingText());showToast('정책 브리핑을 복사했습니다.');}
    catch{const ta=document.createElement('textarea');ta.value=briefingText();document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();showToast('정책 브리핑을 복사했습니다.');}
  }
  function downloadText(name,text){const blob=new Blob([text],{type:'text/plain;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
  function downloadBriefing(){downloadText('temperAIture_대구_정책브리핑.txt',briefingText());showToast('브리핑 파일을 생성했습니다.');}
  function downloadReport(){
    const m=getAccessMetrics();const selected=state.selected;const people=selected.reduce((s,c)=>s+c.people,0);const used=selected.reduce((s,c)=>s+c.cost,0);
    const report=`temperAIture 대구 폭염 대응 분석 리포트\n\n1. 분석 개요\n- 범위: 대구광역시\n- 도보권 기준: ${state.distance}m\n- 취약계층: ${[...state.groups].join(', ')}\n\n2. 사각지대\n- 도보권 밖 취약인구: ${m.outside.toLocaleString()}명\n- 접근성 부족 지역: ${m.areas}곳\n- 평균 쉼터 접근거리: ${m.avg}m\n\n3. 추천 결과\n${selected.map((c,i)=>`${i+1}) ${c.name} / ${c.people.toLocaleString()}명 / ${formatMoney(c.cost)}`).join('\n')}\n- 추가 보호 가능 인구: ${people.toLocaleString()}명\n- 예산 사용: ${formatMoney(used)} / ${formatMoney(state.budget)}\n\n4. 정책 메시지\n시설 수를 늘리는 것보다 위험·취약인구·접근성이 중첩되는 곳에 먼저 투자합니다.\n\n※ 해커톤 시연용 가공 데이터`;
    downloadText('temperAIture_대구_분석리포트.txt',report);showToast('리포트를 다운로드했습니다.');
  }

  document.querySelectorAll('.nav-item').forEach(n=>n.addEventListener('click',()=>go(n.dataset.page)));
  document.getElementById('openBriefing').addEventListener('click',openBriefing);
  document.getElementById('downloadReport').addEventListener('click',downloadReport);
  document.getElementById('copyBriefing').addEventListener('click',copyBriefing);
  document.getElementById('downloadBriefing').addEventListener('click',downloadBriefing);
  document.querySelectorAll('[data-close-modal]').forEach(b=>b.addEventListener('click',closeBriefing));
  document.getElementById('briefingModal').addEventListener('click',e=>{if(e.target.id==='briefingModal')closeBriefing();});
  document.getElementById('citySelector').addEventListener('click',()=>showToast('MVP 분석 지역은 대구광역시로 고정되어 있습니다.'));
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeBriefing();});
  render();
})();
</script>
</body>
</html>
