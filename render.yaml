services:
  - type: web
    name: temperaiture-backend
    env: python
    region: singapore # 또는 oregon / frankfurt
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SGIS_CONSUMER_KEY
        sync: false
      - key: SGIS_CONSUMER_SECRET
        sync: false
      - key: ALAN_API_KEY
        sync: false
      - key: ALAN_API_URL
        sync: false
